[project]
name = "billwatch"
version = "0.1.0"
description = "Legislative bill tracker & email digest (LegiScan → SQLite → email), designed to run for free on GitHub Actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32,<3",
    "jinja2>=3.1,<4",
]

[project.scripts]
billwatch = "billwatch.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that spin up local HTTP/SMTP servers",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]   # long literal strings in assertions/fixtures are fine
